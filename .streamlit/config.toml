[server]
# Streamlit's built-in XSRF (CSRF) protection. Note: Streamlit requires
# enableCORS=true for the XSRF cookie mechanism to work, so it auto-overrides
# enableCORS if set to false here — enableXsrfProtection is the setting that
# actually matters for this app and is kept on.
enableXsrfProtection = true
enableCORS = true
# Hard cap on any single upload (defense-in-depth on top of the explicit
# per-file-type checks in src/security/file_validation.py).
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's default hamburger menu / "Deploy" button for a cleaner,
# non-generic-looking interface (this is a supported Streamlit setting, not
# a CSS hack, so it survives Streamlit version upgrades).
toolbarMode = "minimal"

[theme]
# Colors approximating the Saudi Digital Government visual identity
# (navy + teal) — no official DGA brand file was supplied, so this is a
# best-effort palette, not a guaranteed pixel-exact match.
base = "light"
primaryColor = "#00A79D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FA"
textColor = "#0B2545"
font = "sans serif"
